databaseChangeLog:
  - changeSet:
      id: 003-create-rentals-table
      author: Krupko Illia
      changes:
        - createTable:
            tableName: rentals
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: rental_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: return_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: actual_return_date
                  type: DATE
              - column:
                  name: car_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_rentals_car_id
                    references: cars(id)
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_rentals_user_id
                    references: users(id)

        - sql:
            sql: ALTER TABLE rentals ADD CONSTRAINT chk_return_date_after_rental_date CHECK (return_date > rental_date);
        - sql:
            sql: ALTER TABLE rentals ADD CONSTRAINT chk_actual_return_date_after_rental_date CHECK (actual_return_date IS NULL OR actual_return_date >= rental_date);

        - sql:
            sql: CREATE INDEX idx_rentals_car_id ON rentals (car_id);

        - sql:
             sql: CREATE INDEX idx_rentals_active_return_date ON rentals (return_date) WHERE actual_return_date IS NULL;

        - sql:
            sql: CREATE INDEX idx_rentals_user_id ON rentals (user_id);
