databaseChangeLog:
  - changeSet:
      id: 004-create-payments-table
      author: Krupko Illia
      changes:
        - createTable:
            tableName: payments
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: rental_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_payments_rental_id
                    references: rentals(id)
              - column:
                  name: session_url
                  type: VARCHAR(2048)
                  constraints:
                    nullable: false
              - column:
                  name: session_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: total
                  type: DECIMAL(10, 2)
                  constraints:
                    nullable: false

        - sql:
           sql: ALTER TABLE payments ADD CONSTRAINT uq_payments_rental_type UNIQUE (rental_id, type);

        - sql:
            sql: ALTER TABLE payments ADD CONSTRAINT chk_payments_status CHECK (status IN ('PENDING', 'PAID', 'EXPIRED', 'CANCELED'));

        - sql:
            sql: ALTER TABLE payments ADD CONSTRAINT chk_payments_type CHECK (type IN ('PAYMENT', 'FINE'));

        - sql:
            sql: ALTER TABLE payments ADD CONSTRAINT chk_total_non_negative CHECK (total > 0);
